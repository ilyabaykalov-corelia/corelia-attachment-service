databaseChangeLog:
  - changeSet:
      id: attachment-001-create-blob
      author: corelia
      changes:
        - createTable:
            tableName: blob
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: storage_provider
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: bucket
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: sha256
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: media_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: committed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: deleted_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: blob
            indexName: ix_blob_state_created_at
            columns:
              - column:
                  name: state
              - column:
                  name: created_at
