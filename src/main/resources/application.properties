spring.application.name=corelia-attachment-service
corelia.service=corelia-attachment-service
spring.config.import=classpath:corelia-defaults.properties,optional:configtree:/run/secrets/
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=file:${CORELIA_KEY_STORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${corelia.tls.password}
server.ssl.trust-store=file:${CORELIA_TRUST_STORE}
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${corelia.tls.password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.http2.enabled=true
spring.servlet.multipart.max-file-size=${MAX_ATTACHMENT_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_ATTACHMENT_SIZE_MB:10}MB
spring.servlet.multipart.file-size-threshold=0
spring.datasource.url=${CORELIA_ATTACHMENT_DB_URL:jdbc:postgresql://postgres:5432/corelia_attachment}
spring.datasource.username=${CORELIA_ATTACHMENT_DB_USERNAME:corelia_attachment}
spring.datasource.password=${corelia.attachment.db.password:}
spring.liquibase.change-log=classpath:db/changelog/attachment-master.yaml
